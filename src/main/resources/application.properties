spring.application.name=jobPortal
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) -%cyan(%msg%n)}
#logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.ahmed.learning.jobportal=${LOG_LEVEL:INFO}
logging.group.jobportal_Error=com.ahmed.learning.jobportal.security,com.ahmed.learning.jobportal.contact
logging.level.jobportalError=ERROR
#logging.file.name=${LOG_FILE:logs/jobportal.log}
#logging.pattern.file={"timestamp":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ}","level":"%5p","thread":"%t","logger":"%c{1}","message":"%m","exception":"%ex"}%n
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:jobportal}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.hibernate.ddl-auto=update
